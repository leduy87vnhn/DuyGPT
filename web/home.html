<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trợ lý gia đình</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/home.css" />
    <link rel="stylesheet" href="/crm.css" />
    <link rel="stylesheet" href="/module-nav.css" />
  </head>
  <body>
    <main class="shell crm-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark">H</div>
          <div>
            <h1>Trợ lý gia đình</h1>
            <p id="status">Đang kết nối...</p>
          </div>
        </div>

        <div id="loggedOutNotice" class="panel hidden">
          <p class="muted-note">
            Bạn cần đăng nhập trên trang <a href="/">DuyGPT</a> trước khi dùng trợ lý gia đình.
          </p>
        </div>

        <div id="featureDisabledNotice" class="panel hidden">
          <p class="muted-note">Tính năng Trợ lý gia đình hiện đang được quản trị viên tắt.</p>
        </div>
      </aside>

      <section id="crmMain" class="crm-main">
        <div id="tab-chat" class="crm-workspace crm-tab hidden">
          <section id="historyPanel" class="panel">
            <button type="button" class="panel-header" id="historyToggle" aria-expanded="false" aria-controls="historyBody">
              <span class="panel-title">Lịch sử trò chuyện</span>
              <span class="chevron">&#9662;</span>
            </button>
            <div id="historyBody" class="panel-body">
              <button id="newChat" type="button" class="secondary">Cuộc trò chuyện mới</button>
              <div id="historyList" class="history-list"></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-title">Trò chuyện với trợ lý</div>
            <div id="messages" class="messages crm-messages"></div>
            <form id="composer" class="composer home-composer">
              <div class="prompt-box">
                <textarea id="prompt" rows="1" placeholder="Nhắn với trợ lý gia đình..."></textarea>
              </div>
              <div class="composer-actions">
                <div id="voiceStatus" class="voice-status" aria-live="polite"></div>
                <button id="record" class="icon-button" type="button" aria-label="Start recording" title="Start recording">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"></path>
                    <path d="M19 11a7 7 0 0 1-14 0"></path>
                    <path d="M12 18v3"></path>
                    <path d="M8 21h8"></path>
                  </svg>
                </button>
                <button id="send" class="icon-button" type="submit" aria-label="Gửi" title="Gửi">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m22 2-7 20-4-9-9-4Z"></path>
                    <path d="M22 2 11 13"></path>
                  </svg>
                </button>
              </div>
            </form>
          </section>
        </div>

        <div id="tab-lichgiadinh" class="crm-workspace crm-tab hidden">
          <section class="panel">
            <div class="panel-title">Lịch Gia Đình</div>
            <div id="calendarList" class="crm-list"></div>
          </section>
        </div>

        <div id="tab-nhacviec" class="crm-workspace crm-tab hidden">
          <section class="panel">
            <div class="panel-title">Nhắc Việc</div>
            <div id="reminderList" class="crm-list"></div>
          </section>
        </div>

        <div id="tab-muasam" class="crm-workspace crm-tab hidden">
          <section class="panel">
            <div class="panel-title">Mua Sắm</div>
            <div id="shoppingList" class="crm-list"></div>
          </section>
        </div>

        <div id="tab-ghichu" class="crm-workspace crm-tab hidden">
          <section class="panel">
            <div class="panel-title">Ghi Chú</div>
            <div id="noteList" class="crm-list"></div>
          </section>
        </div>
      </section>
    </main>

    <button id="fabAdd" type="button" class="fab-add" aria-label="Thêm">+</button>
    <div id="addChoicePopup" class="add-choice-popup hidden">
      <button type="button" data-choice="calendar">Lịch gia đình</button>
      <button type="button" data-choice="reminder">Nhắc việc</button>
      <button type="button" data-choice="shopping">Mua sắm</button>
      <button type="button" data-choice="note">Ghi chú</button>
    </div>

    <div id="modalCalendar" class="modal-overlay hidden">
      <div class="modal-box">
        <button type="button" class="modal-close" data-close aria-label="Đóng">&times;</button>
        <div class="panel-title">Thêm Lịch Gia Đình</div>
        <form id="calendarForm" class="crm-form">
          <label class="field-label" for="calendarTitle">Sự kiện / cuộc hẹn</label>
          <input id="calendarTitle" placeholder="Sự kiện / cuộc hẹn" required />
          <label class="field-label" for="calendarLocation">Địa điểm</label>
          <input id="calendarLocation" placeholder="Địa điểm" />
          <label class="field-label" for="calendarStart">Bắt đầu</label>
          <input id="calendarStart" type="datetime-local" required />
          <label class="field-label" for="calendarEnd">Kết thúc</label>
          <input id="calendarEnd" type="datetime-local" required />
          <button type="submit">Thêm lịch</button>
        </form>
      </div>
    </div>

    <div id="modalReminder" class="modal-overlay hidden">
      <div class="modal-box">
        <button type="button" class="modal-close" data-close aria-label="Đóng">&times;</button>
        <div class="panel-title">Thêm Nhắc Việc</div>
        <form id="reminderForm" class="crm-form">
          <label class="field-label" for="reminderInput">Việc cần nhắc</label>
          <input id="reminderInput" placeholder="Việc cần nhắc..." required />
          <button type="submit">Thêm</button>
        </form>
      </div>
    </div>

    <div id="modalShopping" class="modal-overlay hidden">
      <div class="modal-box">
        <button type="button" class="modal-close" data-close aria-label="Đóng">&times;</button>
        <div class="panel-title">Thêm Mua Sắm</div>
        <form id="shoppingForm" class="crm-form">
          <label class="field-label" for="shoppingInput">Món cần mua</label>
          <input id="shoppingInput" placeholder="Món cần mua..." required />
          <label class="field-label" for="shoppingQuantityInput">Số lượng</label>
          <input id="shoppingQuantityInput" placeholder="SL" class="quantity-input" />
          <button type="submit">Thêm</button>
        </form>
      </div>
    </div>

    <div id="modalNote" class="modal-overlay hidden">
      <div class="modal-box">
        <button type="button" class="modal-close" data-close aria-label="Đóng">&times;</button>
        <div class="panel-title">Thêm Ghi Chú</div>
        <form id="noteForm" class="crm-form">
          <label class="field-label" for="noteInput">Ghi chú nhanh</label>
          <input id="noteInput" placeholder="Ghi chú nhanh..." required />
          <button type="submit">Thêm</button>
        </form>
      </div>
    </div>

    <script src="/module-nav.js"></script><script src="/voice-input.js"></script><script src="/home.js"></script>
  </body>
</html>
