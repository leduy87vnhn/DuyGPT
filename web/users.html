<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý người dùng · DuyGPT</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/crm.css"><link rel="stylesheet" href="/module-nav.css"></head>
<body><main class="standalone"><section class="panel account-card"><h1>Quản lý người dùng</h1><p class="muted-note" id="status">Đang kiểm tra...</p>
<p class="muted-note hidden" id="notAdminNotice">Chỉ tài khoản admin mới xem được trang này.</p>
<div id="content" class="hidden">
<form id="createForm" class="crm-form">
<input id="newUsername" placeholder="Tên đăng nhập mới" required>
<input id="newPassword" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" required>
<label class="checkbox-line"><input type="checkbox" id="newCrmAccess"> Cấp quyền CRM ngay khi tạo</label>
<button type="submit">Tạo tài khoản</button>
<p class="auth-error" id="createError"></p>
</form>
<div id="userList" class="crm-list"></div>
</div>
</section></main><script src="/module-nav.js"></script><script src="/users.js"></script></body></html>
