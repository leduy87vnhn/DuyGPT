<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DuyGPT</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/module-nav.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark">D</div>
          <div>
            <h1>DuyGPT</h1>
            <div class="status-line">
              <p id="status">Connecting...</p>
              <p class="gpu" id="gpu"></p>
            </div>
          </div>
        </div>

        <section id="settingsPanel" class="panel module-settings">
          <button type="button" class="panel-header" id="settingsToggle" aria-expanded="true" aria-controls="settingsBody">
            <span class="panel-title">Account &amp; Settings</span>
            <span class="chevron">&#9662;</span>
          </button>
          <div id="settingsBody" class="panel-body">
            <div id="authLoggedOut">
              <div class="tabs">
                <button type="button" id="tabLogin" class="tab active">Login</button>
                <button type="button" id="tabRegister" class="tab">Register</button>
              </div>
              <form id="loginForm" class="auth-form">
                <input id="loginUsername" autocomplete="username" placeholder="Username" required />
                <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required />
                <button type="submit">Log in</button>
                <p class="auth-error" id="loginError"></p>
              </form>
              <form id="registerForm" class="auth-form hidden">
                <input id="registerUsername" autocomplete="username" placeholder="Username (min 3 chars)" required />
                <input id="registerPassword" type="password" autocomplete="new-password" placeholder="Password (min 6 chars)" required />
                <button type="submit">Create account</button>
                <p class="auth-error" id="registerError"></p>
              </form>
            </div>
            <div id="authLoggedIn" class="hidden">
              <div class="user-badge">
                <span id="userBadgeName"></span>
                <span id="userBadgeType" class="badge"></span>
              </div>
              <button type="button" id="logoutBtn" class="secondary">Log out</button>
            </div>

            <label>
              Provider
              <select id="provider">
                <option value="ollama">Ollama</option>
                <option value="openai">OpenAI-compatible</option>
              </select>
            </label>

            <label>
              Model
              <input id="model" autocomplete="off" placeholder="llama3.1" />
            </label>

            <label>
              Temperature
              <input id="temperature" type="range" min="0" max="2" step="0.1" value="0.7" />
              <span id="temperatureValue">0.7</span>
            </label>
          </div>
        </section>

        <button id="newChat" type="button">New chat</button>

        <section id="historyPanel" class="panel hidden">
          <button type="button" class="panel-header" id="historyToggle" aria-expanded="true" aria-controls="historyBody">
            <span class="panel-title">History</span>
            <span class="chevron">&#9662;</span>
          </button>
          <div id="historyBody" class="panel-body">
            <div id="historyList" class="history-list"></div>
          </div>
        </section>

        <section id="adminPanel" class="panel hidden module-settings">
          <button type="button" class="panel-header" id="adminToggle" aria-expanded="true" aria-controls="adminBody">
            <span class="panel-title">Documents (RAG)</span>
            <span class="chevron">&#9662;</span>
          </button>
          <div id="adminBody" class="panel-body">
            <form id="uploadForm" class="auth-form">
              <input id="uploadFile" type="file" accept=".txt,.md,.pdf,.docx,.pptx,.xlsx" required />
              <button type="submit">Upload</button>
              <p class="auth-error" id="uploadError"></p>
            </form>
            <div id="documentList" class="history-list"></div>
          </div>
        </section>
      </aside>

      <section class="chat">
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <div class="prompt-box">
            <textarea id="prompt" rows="1" placeholder="Message DuyGPT"></textarea>
          </div>
          <div class="composer-actions">
            <div id="voiceStatus" class="voice-status" aria-live="polite"></div>
            <button id="record" class="icon-button" type="button" aria-label="Start recording" title="Start recording">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"></path>
                <path d="M19 11a7 7 0 0 1-14 0"></path>
                <path d="M12 18v3"></path>
                <path d="M8 21h8"></path>
              </svg>
            </button>
            <button id="image" class="icon-button" type="button" aria-label="Generate image" title="Generate image">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <circle cx="9" cy="9" r="2"></circle>
                <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path>
              </svg>
            </button>
            <button id="send" class="icon-button" type="submit" aria-label="Send" title="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m22 2-7 20-4-9-9-4Z"></path>
                <path d="M22 2 11 13"></path>
              </svg>
            </button>
          </div>
        </form>
      </section>
    </main>
    <script src="/module-nav.js"></script><script src="/app.js"></script>
  </body>
</html>
