<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trợ lý công việc</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/home.css" />
    <link rel="stylesheet" href="/crm.css" />
    <link rel="stylesheet" href="/module-nav.css" />
  </head>
  <body>
    <main class="shell crm-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark">W</div>
          <div>
            <h1>Trợ lý công việc</h1>
            <p id="status">Đang kết nối...</p>
          </div>
        </div>

        <div id="featureDisabledNotice" class="panel hidden">
          <p class="muted-note">Tính năng Trợ lý công việc hiện đang được quản trị viên tắt.</p>
        </div>
      </aside>

      <section id="crmMain" class="crm-main">
        <div id="tab-chat" class="crm-workspace crm-tab hidden">
          <section id="historyPanel" class="panel">
            <button type="button" class="panel-header" id="historyToggle" aria-expanded="false" aria-controls="historyBody">
              <span class="panel-title">Lịch sử trò chuyện</span>
              <span class="chevron">&#9662;</span>
            </button>
            <div id="historyBody" class="panel-body">
              <button id="newChat" type="button" class="secondary">Cuộc trò chuyện mới</button>
              <div id="historyList" class="history-list"></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-title">Trò chuyện với trợ lý</div>
            <div id="messages" class="messages crm-messages"></div>
            <form id="composer" class="composer home-composer">
              <div class="prompt-box">
                <textarea id="prompt" rows="1" placeholder="Nhờ trợ lý thêm việc cần làm hoặc lịch họp..."></textarea>
              </div>
              <div class="composer-actions">
                <div id="voiceStatus" class="voice-status" aria-live="polite"></div>
                <button id="record" class="icon-button" type="button" aria-label="Start recording" title="Start recording">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"></path>
                    <path d="M19 11a7 7 0 0 1-14 0"></path>
                    <path d="M12 18v3"></path>
                    <path d="M8 21h8"></path>
                  </svg>
                </button>
                <button id="send" class="icon-button" type="submit" aria-label="Gửi" title="Gửi">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m22 2-7 20-4-9-9-4Z"></path>
                    <path d="M22 2 11 13"></path>
                  </svg>
                </button>
              </div>
            </form>
          </section>
        </div>

        <div id="tab-vieccanlam" class="crm-workspace crm-tab hidden">
          <section class="panel">
            <div class="panel-title">Việc Cần Làm</div>
            <div id="taskList" class="crm-list"></div>
          </section>
        </div>

        <div id="tab-lichhop" class="crm-workspace crm-tab hidden">
          <section class="panel">
            <div class="panel-title">Lịch Họp</div>
            <div id="meetingList" class="crm-list"></div>
          </section>
        </div>
      </section>
    </main>

    <button id="fabAdd" type="button" class="fab-add" aria-label="Thêm">+</button>
    <div id="addChoicePopup" class="add-choice-popup hidden">
      <button type="button" data-choice="task">Công việc</button>
      <button type="button" data-choice="meeting">Lịch họp</button>
    </div>

    <div id="modalTask" class="modal-overlay hidden">
      <div class="modal-box">
        <button type="button" class="modal-close" data-close aria-label="Đóng">&times;</button>
        <div class="panel-title">Thêm Công Việc</div>
        <form id="taskForm" class="crm-form">
          <label class="field-label" for="taskTitleInput">Nội dung công việc</label>
          <input id="taskTitleInput" placeholder="VD: Nộp báo cáo tháng" required />
          <label class="field-label" for="taskDueInput">Hạn chót (không bắt buộc)</label>
          <input id="taskDueInput" type="datetime-local" />
          <button type="submit">Thêm việc cần làm</button>
        </form>
      </div>
    </div>

    <div id="modalMeeting" class="modal-overlay hidden">
      <div class="modal-box">
        <button type="button" class="modal-close" data-close aria-label="Đóng">&times;</button>
        <div class="panel-title">Thêm Lịch Họp</div>
        <form id="meetingForm" class="crm-form">
          <label class="field-label" for="meetingTitleInput">Cuộc họp / cuộc hẹn</label>
          <input id="meetingTitleInput" placeholder="VD: Họp với khách hàng A" required />
          <label class="field-label" for="meetingLocationInput">Địa điểm</label>
          <input id="meetingLocationInput" placeholder="Địa điểm" />
          <label class="field-label" for="meetingStartInput">Bắt đầu</label>
          <input id="meetingStartInput" type="datetime-local" required />
          <label class="field-label" for="meetingEndInput">Kết thúc</label>
          <input id="meetingEndInput" type="datetime-local" required />
          <button type="submit">Thêm lịch họp</button>
        </form>
      </div>
    </div>

    <script src="/module-nav.js"></script><script src="/voice-input.js"></script><script src="/work.js"></script>
  </body>
</html>
